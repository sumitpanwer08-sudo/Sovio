name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install & Build App
        run: |
          npm install
          npm run build || true
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true

      - name: Setup Capacitor & Generate Native Android
        run: |
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          rm -rf android
          npx cap init "Sovio" "com.sovio.app" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Build Android APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
